<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="30%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050B14" />
    </radialGradient>

    <!-- Token Base Gradient -->
    <linearGradient id="tokenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Faucet/Drop Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <!-- Metallic Edge Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#64748B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Base Circle (Rounded Favicon Frame) -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="12" />

  <!-- Inner Subtle Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38BDF8" stroke-opacity="0.15" stroke-width="4" stroke-dasharray="12 8" />

  <!-- Main Litecoin Token Circle -->
  <circle cx="256" cy="256" r="165" fill="url(#tokenGrad)" filter="url(#glow)" />

  <!-- Inner Token Rim Shadow -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#000000" stroke-opacity="0.25" stroke-width="6" />

  <!-- Play Button (Right Arrow Backdrop) -->
  <path d="M 215 155 L 340 256 L 215 357 Z" fill="#0284C7" fill-opacity="0.35" />

  <!-- Stylized Faucet Water Drop (Top/Center Integration) -->
  <path d="M 256 110 C 256 110 295 165 295 195 C 295 216.5 277.5 234 256 234 C 234.5 234 217 216.5 217 195 C 217 165 256 110 256 110 Z" fill="url(#accentGrad)" opacity="0.85" />

  <!-- Drop Inner Highlight -->
  <path d="M 248 140 C 248 140 230 180 230 195 C 230 205 236 215 246 218 C 238 215 234 206 234 195 C 234 180 248 140 248 140 Z" fill="#FFFFFF" opacity="0.6" />

  <!-- Bold Litecoin 'Ł' Symbol -->
  <g fill="#FFFFFF" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.4))">
    <!-- Vertical Main Stem -->
    <path d="M 226 145 L 260 145 L 234 325 L 315 325 L 310 355 L 200 355 Z" />
    <!-- Crossbar -->
    <path d="M 205 262 L 285 232 L 277 257 L 197 287 Z" fill="#E0F2FE" />
  </g>

  <!-- Corner Specular Shine (Glossy Finish) -->
  <path d="M 60 210 A 240 240 0 0 1 210 60 A 210 210 0 0 0 90 180 Z" fill="#FFFFFF" opacity="0.08" />
</svg>
