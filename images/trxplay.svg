<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Metallic Edge Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#475569" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8" />
    </linearGradient>

    <!-- Dark Inner Base Gradient -->
    <radialGradient id="innerBgGrad" cx="30%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050B14" />
    </radialGradient>

    <!-- TRON Red Token Base Gradient -->
    <linearGradient id="trxTokenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="45%" stop-color="#EF0000" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <!-- Red Water Drop Accent Gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#D90429" />
    </linearGradient>
  </defs>

  <!-- Outer Metallic Ring (Border of Favicon) -->
  <circle cx="256" cy="256" r="240" fill="url(#innerBgGrad)" stroke="url(#ringGrad)" stroke-width="12" />

  <!-- Inner Dashed Accent Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#FF4D4D" stroke-opacity="0.2" stroke-width="4" stroke-dasharray="12 8" />

  <!-- Main TRON Token Circle -->
  <circle cx="256" cy="256" r="165" fill="url(#trxTokenGrad)" filter="url(#glow)" />

  <!-- Inner Token Rim Shadow -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#000000" stroke-opacity="0.3" stroke-width="6" />

  <!-- Play Button (Right Arrow Backdrop) -->
  <path d="M 215 155 L 340 256 L 215 357 Z" fill="#990000" fill-opacity="0.35" />

  <!-- Stylized Faucet Water Drop (Top/Center Integration) -->
  <path d="M 256 110 C 256 110 295 165 295 195 C 295 216.5 277.5 234 256 234 C 234.5 234 217 216.5 217 195 C 217 165 256 110 256 110 Z" fill="url(#dropGrad)" opacity="0.9" />

  <!-- Drop Inner Highlight -->
  <path d="M 248 140 C 248 140 230 180 230 195 C 230 205 236 215 246 218 C 238 215 234 206 234 195 C 234 180 248 140 248 140 Z" fill="#FFFFFF" opacity="0.6" />

  <!-- Official TRON (TRX) Logo Geometry -->
  <g fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.5))">
    <!-- Outer Polygon Contour -->
    <polygon points="185,170 345,215 290,345 185,170" fill="none" />
    <!-- Inner Structural Facet Lines -->
    <line x1="185" y1="170" x2="275" y2="250" />
    <line x1="345" y1="215" x2="275" y2="250" />
    <line x1="290" y1="345" x2="275" y2="250" />
  </g>

  <!-- Specular Reflection Shine (Glossy Finish) -->
  <path d="M 60 210 A 240 240 0 0 1 210 60 A 210 210 0 0 0 90 180 Z" fill="#FFFFFF" opacity="0.08" />
</svg>
