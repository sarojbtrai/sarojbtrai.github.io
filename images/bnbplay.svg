<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Metallic Edge Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#78350F" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8" />
    </linearGradient>

    <!-- Dark Inner Base Gradient -->
    <radialGradient id="innerBgGrad" cx="30%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050B14" />
    </radialGradient>

    <!-- BNB Gold/Yellow Token Base Gradient -->
    <linearGradient id="bnbTokenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Golden Water Drop Accent Gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
  </defs>

  <!-- Outer Metallic Ring (Border of Favicon) -->
  <circle cx="256" cy="256" r="240" fill="url(#innerBgGrad)" stroke="url(#ringGrad)" stroke-width="12" />

  <!-- Inner Dashed Accent Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#F59E0B" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="12 8" />

  <!-- Main BNB Token Circle -->
  <circle cx="256" cy="256" r="165" fill="url(#bnbTokenGrad)" filter="url(#glow)" />

  <!-- Inner Token Rim Shadow -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#000000" stroke-opacity="0.3" stroke-width="6" />

  <!-- Play Button (Right Arrow Backdrop) -->
  <path d="M 215 155 L 340 256 L 215 357 Z" fill="#78350F" fill-opacity="0.35" />

  <!-- Stylized Faucet Water Drop (Top/Center Integration) -->
  <path d="M 256 110 C 256 110 295 165 295 195 C 295 216.5 277.5 234 256 234 C 234.5 234 217 216.5 217 195 C 217 165 256 110 256 110 Z" fill="url(#dropGrad)" opacity="0.95" />

  <!-- Drop Inner Highlight -->
  <path d="M 248 140 C 248 140 230 180 230 195 C 230 205 236 215 246 218 C 238 215 234 206 234 195 C 234 180 248 140 248 140 Z" fill="#FFFFFF" opacity="0.7" />

  <!-- Official BNB Diamond Logo Geometry -->
  <g fill="#FFFFFF" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.4))">
    <!-- Center Square (Rotated) -->
    <polygon points="256,227 285,256 256,285 227,256" />
    <!-- Top Diamond -->
    <polygon points="256,175 279,198 256,221 233,198" />
    <!-- Bottom Diamond -->
    <polygon points="256,291 279,314 256,337 233,314" />
    <!-- Left Diamond -->
    <polygon points="175,256 198,233 221,256 198,279" />
    <!-- Right Diamond -->
    <polygon points="337,256 314,233 291,256 314,279" />
  </g>

  <!-- Specular Reflection Shine (Glossy Finish) -->
  <path d="M 60 210 A 240 240 0 0 1 210 60 A 210 210 0 0 0 90 180 Z" fill="#FFFFFF" opacity="0.08" />
</svg>
